<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>논리 퍼즐 모음</title>
  <meta name="description" content="직접 골라 만든 논리 퍼즐 게임 모음">

<body>
